<div class="compliance">
  <header class="page-header">
    <h1>Compliance</h1>
    <p>Manage client compliance and status</p>
  </header>

  <div class="toolbar">
    <label class="search">
      <mat-icon>search</mat-icon>
      <input
        type="search"
        placeholder="Search by client ID or name"
        [(ngModel)]="searchQuery"
        (input)="onSearchChange()"
        aria-label="Search clients"
      />
    </label>
  </div>

  <section class="card">
    <div class="table-wrap">
      <table *ngIf="displayedClients.length > 0">
        <thead>
          <tr>
            <th>Client ID</th>
            <th>Name</th>
            <th>Status</th>
            <th class="action" aria-label="Actions"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let client of displayedClients" class="row">
            <td class="id">{{ client.id }}</td>
            <td>{{ client.name }}</td>
            <td>
              <span class="badge" [ngClass]="getStatusTone(client.status)">
                <mat-icon>{{ client.status === 'active' ? 'check_circle' : 'block' }}</mat-icon>
                {{ getStatusLabel(client.status) }}
              </span>
            </td>
            <td class="action">
              <button
                type="button"
                class="icon-button"
                (click)="toggleClientStatus(client)"
                [title]="'Toggle to ' + (client.status === 'active' ? 'Blacklisted' : 'Active')"
                [attr.aria-label]="'Toggle to ' + (client.status === 'active' ? 'Blacklisted' : 'Active')"
              >
                <mat-icon>swap_horiz</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <p *ngIf="displayedClients.length === 0" class="empty">No clients found</p>
  </section>
</div>
