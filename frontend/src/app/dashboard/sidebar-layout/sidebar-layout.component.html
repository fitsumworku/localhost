<div class="sidebar-layout dark-ui">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img src="favicon-8080.svg" alt="8080 logo">
      </div>
      <span class="brand-name">Localhost</span>
    </div>

    <nav class="sidebar-menu">
      <p class="menu-label">Menu</p>
      <ul class="menu-list">
        <li *ngFor="let item of menuItems">
          <a class="menu-item" [routerLink]="item.route" routerLinkActive="active">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="logout-button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Log out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Top Header with Account Selector -->
    <div class="top-header" *ngIf="!isAdmin">
      <div class="header-content">
        <h1>{{ selectedAccount?.accountName || 'Accounts' }}</h1>
        <div class="header-actions">
          <mat-form-field appearance="outline" class="account-selector" subscriptSizing="dynamic">
            <mat-label>Account</mat-label>
            <mat-select
              panelClass="dark-ui"
              [value]="selectedAccount"
              (selectionChange)="selectAccount($event.value)"
            >
              <mat-option *ngFor="let account of accounts" [value]="account">
                {{ account.accountName || ('Account ' + account.accountId) }} ({{ account.currency }})
              </mat-option>
            </mat-select>
          </mat-form-field>
          <button type="button" class="icon-button" (click)="openAddAccountDialog()" title="Add new account" aria-label="Add new account">
            <mat-icon>add</mat-icon>
          </button>
          <ng-container *ngIf="selectedAccount">
            <button type="button" class="ghost-button" (click)="openCashMovement('deposit')">
              <mat-icon>add_circle_outline</mat-icon>
              Deposit
            </button>
            <button type="button" class="ghost-button" (click)="openCashMovement('withdrawal')">
              <mat-icon>remove_circle_outline</mat-icon>
              Withdraw
            </button>
          </ng-container>
        </div>
      </div>
    </div>

    <!-- Page Content -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
