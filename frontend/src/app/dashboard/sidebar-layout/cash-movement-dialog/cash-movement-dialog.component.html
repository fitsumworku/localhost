<div class="cash-dialog">
  <div class="dialog-header">
    <h2>{{ isDeposit ? 'Deposit Cash' : 'Withdraw Cash' }}</h2>
    <button mat-icon-button type="button" (click)="onCancel()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Amount</mat-label>
      <input matInput type="number" min="0.01" step="0.01" formControlName="amount" />
      <span matTextPrefix>$&nbsp;</span>
      <mat-error *ngIf="form.get('amount')?.hasError('required')">Amount is required.</mat-error>
      <mat-error *ngIf="form.get('amount')?.hasError('min')">Amount must be at least $0.01.</mat-error>
    </mat-form-field>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="dialog-actions">
      <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting">
        {{ isSubmitting ? 'Submitting...' : (isDeposit ? 'Deposit' : 'Withdraw') }}
      </button>
    </div>
  </form>
</div>
