<div class="disputes">
  <header class="page-header">
    <h1>Client Disputes</h1>
    <p>Manage and resolve client disputes</p>
  </header>

  <!-- Filters: one row above the table -->
  <div class="toolbar">
    <label class="search">
      <mat-icon>search</mat-icon>
      <input
        type="search"
        placeholder="Search by client ID or reason"
        [(ngModel)]="searchQuery"
        (input)="onSearchChange()"
        aria-label="Search disputes"
      />
    </label>

    <div class="pills" role="group" aria-label="Status">
      <button
        *ngFor="let status of statusOptions"
        type="button"
        [class.active]="isStatusFilterActive(status.value)"
        [attr.aria-pressed]="isStatusFilterActive(status.value)"
        (click)="selectStatusFilter(status.value)"
      >
        {{ status.label }}
      </button>
    </div>
  </div>

  <section class="card">
    <div class="table-wrap">
      <table *ngIf="displayedDisputes.length > 0">
        <thead>
          <tr>
            <th>Date</th>
            <th>Client ID</th>
            <th>Reason</th>
            <th class="num">Disputed amount</th>
            <th>Status</th>
            <th>Assigned owner</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let dispute of displayedDisputes" class="row" (click)="openDisputeDetail(dispute)">
            <td class="muted">{{ dispute.date }}</td>
            <td class="id">{{ dispute.clientId }}</td>
            <td>{{ dispute.reason }}</td>
            <td class="num">{{ dispute.disputedAmount | currency }}</td>
            <td>
              <span class="badge" [ngClass]="getStatusTone(dispute.status)">
                {{ getStatusLabel(dispute.status) }}
              </span>
            </td>
            <td>{{ dispute.assignedOwner }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p *ngIf="displayedDisputes.length === 0" class="empty">No disputes found</p>
  </section>
</div>
