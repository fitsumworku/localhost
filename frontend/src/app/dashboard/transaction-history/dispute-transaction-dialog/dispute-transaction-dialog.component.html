<div class="dispute-dialog">
  <!-- Header -->
  <div class="dialog-header">
    <div class="transaction-info">
      <h2>Dispute Transaction</h2>
      <p class="transaction-details">
        {{ data.date }} • {{ data.asset }} • {{ data.type | uppercase }} • {{ data.amount }} • ${{ data.price }}
      </p>
    </div>
    <button mat-icon-button (click)="close()" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form -->
  <form [formGroup]="disputeForm" class="dispute-form">
    <!-- Dispute Reason -->
    <div class="form-group">
      <label class="form-label">Dispute Reason</label>
      <mat-form-field>
        <mat-label>Select a reason</mat-label>
        <mat-select formControlName="reason">
          <mat-option *ngFor="let reason of disputeReasons" [value]="reason.value">
            {{ reason.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Supporting Details -->
    <div class="form-group">
      <label class="form-label">Supporting Details</label>
      <mat-form-field class="textarea-field">
        <mat-label>Describe the issue, include any relevant timestamps, order IDs, or expected behavior.</mat-label>
        <textarea
          matInput
          formControlName="details"
          rows="5"
          placeholder="Provide detailed information..."
        ></textarea>
      </mat-form-field>
      <p class="field-hint" *ngIf="disputeForm.get('details')?.hasError('minlength')">
        Minimum 10 characters required
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="dialog-actions">
      <button type="button" mat-stroked-button (click)="close()" class="cancel-btn">
        Cancel
      </button>
      <button
        type="button"
        mat-raised-button
        (click)="onSubmit()"
        class="submit-btn"
        [disabled]="!disputeForm.valid"
      >
        Submit Dispute
      </button>
    </div>
  </form>
</div>
