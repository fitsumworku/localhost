# Application
spring.application.name=team
server.port=8081

# Operational PostgreSQL database (local IDE defaults).
# Existing SPRING_DATASOURCE_* variables in Docker Compose override these properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sampleoltpdata}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Create/reset tables with the SQL file.
# Hibernate checks that the resulting schema matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Reject request fields that are not defined in the DTO.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Keep internal exception details out of HTTP responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# JWT signing key: Base64 encoding of at least 32 random bytes.
jwt.secret=${JWT_SECRET_BASE64}

# Access tokens expire after 15 minutes.
jwt.expiration-ms=900000

jwt.issuer=leap-team-api
jwt.audience=leap-team-client

# Angular development server and your Docker-hosted frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8090}

# Generated API documentation includes the bearerAuth security scheme.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Load the checked-in Fauxnance catalog at startup. Existing rows and statuses are preserved.
# dev-v1.json is a subset with different exchange labels; use it INSTEAD OF us-v1.json.
app.securities.seed.enabled=${SECURITIES_SEED_ENABLED:true}
app.securities.seed.resources=${SECURITIES_SEED_RESOURCES:classpath:universes/us-v1.json,classpath:universes/india-v1.json,classpath:universes/fx-v1.json,classpath:universes/crypto-v1.json}

# Order execution is an internal durable worker, never a public execute-order endpoint.
app.orders.worker-enabled=${ORDER_WORKER_ENABLED:true}
app.orders.poll-delay-ms=${ORDER_POLL_DELAY_MS:5000}
app.orders.batch-size=25
app.orders.lease-seconds=180
app.orders.closed-retry-seconds=300
app.orders.error-retry-seconds=60

# Separate from your application's JWT. Set FAUXNANCE_API_KEY in the existing .env.
app.fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
app.fauxnance.api-key=${FAUXNANCE_API_KEY:}
app.fauxnance.timeout-seconds=10
# Fauxnance is an educational provider; preserve 'synthetic' provenance in each fill.
app.fauxnance.allow-synthetic=${FAUXNANCE_ALLOW_SYNTHETIC:true}
app.fauxnance.max-quote-age-seconds=1800
# FX uses daily reference data; allow weekends, but never provider-marked stale data.
app.fauxnance.max-fx-age-seconds=345600

# Teaching calendar fallback for provider marketState=unknown (not a full exchange calendar).
# Set false to require explicit 'open' for equities/ETFs. Known pre/post/closed states always wait.
app.trading-calendar.allow-unknown-equity-state=${ALLOW_UNKNOWN_EQUITY_STATE:true}
# Comma-separated ISO dates, in each exchange's local time. Maintain these for your demo dates.
app.trading-calendar.us-closed-dates=${US_MARKET_CLOSED_DATES:}
app.trading-calendar.india-closed-dates=${INDIA_MARKET_CLOSED_DATES:}
