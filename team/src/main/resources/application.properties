spring.application.name=team

spring.datasource.url=jdbc:postgresql://localhost:5432/sampleoltpdata
spring.datasource.username=postgres
spring.datasource.password=${dbpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Recommended for Hibernate & PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Schema is created by initdb SQL; disable Hibernate DDL mutations to avoid view dependency errors.
spring.jpa.hibernate.ddl-auto=none

server.port=8081

# Swagger UI shows our hand-written spec (src/main/resources/static/openapi.yaml)
springdoc.swagger-ui.url=/openapi.yaml

jwt.secret=${JWT_SECRET:replace-with-a-strong-secret-at-least-32-characters}
jwt.expiration-ms=3600000


